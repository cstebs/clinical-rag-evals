run_id: 001-baseline
description: >-
  Deliberately weak baseline. Fixed 512-token windows over flat text, dense retrieval only, no reranking, no query handling. Chosen to leave visible headroom: a strong baseline makes a boring table.

chunking:
  strategy: fixed
  target_tokens: 512
  overlap_tokens: 0

retrieval:
  index: dense
  rerank: false
  rerank_depth: 30
  query_rewrite: false
  top_k: 10

generation:
  enabled: true
  model: claude-opus-5
  max_context_chars: 24000

prompts:
  generate: v1
  judge: v1
  rewrite: v1
