run_id: 005-size-1024
description: >-
  Chunk size only: 512 to 1024 tokens. Note the encoder truncates at 512, so part of every oversized chunk is never embedded - the run record reports how much.
baseline: 003-chunk-section

chunking:
  strategy: section
  target_tokens: 1024
  overlap_tokens: 0

retrieval:
  index: dense
  rerank: false
  rerank_depth: 30
  query_rewrite: false
  top_k: 10

generation:
  enabled: true
  model: claude-opus-5
  max_context_chars: 24000
