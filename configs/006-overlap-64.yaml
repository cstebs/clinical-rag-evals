run_id: 006-overlap-64
description: >-
  Overlap only: 0 to 64 tokens carried between adjacent chunks, so an answer straddling a boundary survives in at least one chunk.
baseline: 003-chunk-section

chunking:
  strategy: section
  target_tokens: 512
  overlap_tokens: 64

retrieval:
  index: dense
  rerank: false
  rerank_depth: 30
  query_rewrite: false
  top_k: 10

generation:
  enabled: true
  model: claude-opus-5
  max_context_chars: 24000
