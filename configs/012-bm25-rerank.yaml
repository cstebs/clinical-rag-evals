run_id: 012-bm25-rerank
description: >-
  Reranking only, on the lexical retriever instead of the hybrid one. Tests whether a cross-encoder can rescue a weaker first-stage candidate pool.
baseline: 007-retrieval-bm25

chunking:
  strategy: section
  target_tokens: 512
  overlap_tokens: 0

retrieval:
  index: bm25
  rerank: true
  rerank_depth: 30
  query_rewrite: false
  top_k: 10

generation:
  enabled: true
  model: claude-opus-5
  max_context_chars: 24000
